[package]
name = "certtui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1.92"
base64 = "0.23.1"
certtui-app = { path = "../certtui-app" }
certtui-domain = { path = "../certtui-domain" }
certtui-infra = { path = "../certtui-infra" }
certtui-tui = { path = "../certtui-tui" }
clap = { version = "4", features = ["derive"] }
# `event-stream` for the async key reader; `use-dev-tty` reads keys from the
# terminal device when standard input is a pipe (`cat cert.pem | certtui -`).
crossterm = { version = "0.29", features = ["event-stream", "use-dev-tty"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Runtime of the network commands and of the TUI: multi-threaded, built only
# when needed. The one-shot commands install no signal handler: the default
# SIGINT disposition ends the process.
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
# `CancellationToken` of the `ChainFetcher` port (same version as `certtui-app`).
tokio-util = { version = "0.7.20", default-features = false }

[dev-dependencies]
assert_cmd = "2"
# `FakeChainFetcher` and friends for the CLI unit tests.
certtui-app = { path = "../certtui-app", features = ["testing"] }
insta = "1"
# The PKCS#12 end-to-end test reads the fixture key back to prove it never leaks.
p12-keystore = { version = "0.4.1", default-features = false }
rcgen = "0.14"
# The in-process TLS server of `certtui-infra/tests/support` is compiled into
# `tests/cli_network.rs` with `#[path]`; these are the crates it needs. Provider
# `ring` only, same as `certtui-infra` (no aws-lc).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "test-util", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
