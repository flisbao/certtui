[package]
name = "certtui-app"
version.workspace = true
edition.workspace = true
description = "Application layer of CertTui: ports and use cases to inspect, check and export certificate chains."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["x509", "certificate", "tls", "inspect", "ports"]
categories = ["cryptography", "command-line-utilities"]
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
certtui-domain = { workspace = true }
schemars = "1"
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "sync", "time"] }
tokio-util = { version = "0.7.20", default-features = false }

[dev-dependencies]
proptest = "1.12.0"
rcgen = "0.14"
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util", "time"] }

[features]
# Exposes test doubles (e.g. `FixedClock`) to downstream crates' tests.
testing = []

[lints]
workspace = true
