[package]
name = "certtui-tui"
version.workspace = true
edition.workspace = true
description = "Terminal user interface of CertTui, built with ratatui: certificate chain viewer, batch panel and clipboard support."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["tui", "ratatui", "tls", "certificate", "x509"]
categories = ["command-line-utilities", "cryptography"]
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
certtui-app = { workspace = true }
certtui-domain = { workspace = true }
crossterm = "0.29"
base64 = "0.23.1"
thiserror = "2"
# The password the user types is wiped from memory when the dialog closes.
zeroize = "1"
# The OS clipboard (X11 and Wayland); off with `--no-default-features`.
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"], optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
# Signals that must restore the terminal (SIGINT/SIGTERM).
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "signal", "time"] }

[dev-dependencies]
insta = "1"
serde_json = "1"
rcgen = "0.14"

[features]
default = ["native-clipboard"]
# Clipboard of the operating system through `arboard` (decision D17).
native-clipboard = ["dep:arboard"]
