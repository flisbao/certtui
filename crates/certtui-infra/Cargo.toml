[package]
name = "certtui-infra"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
certtui-app = { path = "../certtui-app" }
certtui-domain = { path = "../certtui-domain" }
cms = { version = "0.2.3", features = ["std"] }
der = { version = "0.7.10", features = ["std"] }
# Only the I/O traits and `ReadBuf` (always available); no runtime features.
tokio = { version = "1.54.1", default-features = false }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt"] }

[features]
# Exposes internal entry points to the cargo-fuzz crate only. Not for normal builds.
fuzzing = []

[lints]
workspace = true
