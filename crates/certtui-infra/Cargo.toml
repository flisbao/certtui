[package]
name = "certtui-infra"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
certtui-app = { path = "../certtui-app" }
certtui-domain = { path = "../certtui-domain" }
cms = { version = "0.2.3", features = ["std"] }
der = { version = "0.7.10", features = ["std"] }
# Provider `ring` only (no aws-lc / C build); TLS 1.2 and 1.3.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = { version = "1.16.0", features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103.17", default-features = false, features = ["ring", "std"] }
# Runtime pieces the fetcher needs: TCP/DNS (`net`), timeouts (`time`), async
# I/O helpers (`io-util`) and `select!` (`macros`). No multi-thread runtime.
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "time"] }
# TLS client over any `AsyncRead + AsyncWrite`; provider `ring` only, TLS 1.2 and 1.3.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
# `CancellationToken` of the `ChainFetcher` port (same version as `certtui-app`).
tokio-util = { version = "0.7.20", default-features = false }
webpki-roots = "1.0.12"

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "time"] }

[features]
# Exposes internal entry points to the cargo-fuzz crate only. Not for normal builds.
fuzzing = []

[lints]
workspace = true
