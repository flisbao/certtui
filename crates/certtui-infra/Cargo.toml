[package]
name = "certtui-infra"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
certtui-app = { path = "../certtui-app" }
certtui-domain = { path = "../certtui-domain" }
cms = { version = "0.2.3", features = ["std"] }
der = { version = "0.7.10", features = ["std"] }
# Provider `ring` only (no aws-lc / C build); TLS 1.2 and 1.3.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
# Only the I/O traits and `ReadBuf` (always available); no runtime features.
tokio = { version = "1.54.1", default-features = false }

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt"] }

[features]
# Exposes internal entry points to the cargo-fuzz crate only. Not for normal builds.
fuzzing = []

[lints]
workspace = true
