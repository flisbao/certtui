[package]
name = "certtui-domain"
version.workspace = true
edition.workspace = true
description = "Domain model of CertTui: X.509 certificate parsing, fingerprints, chain analysis and findings, with no I/O."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["x509", "certificate", "tls", "fingerprint", "parser"]
categories = ["cryptography", "parser-implementations"]
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
idna = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
x509-parser = "0.18.1"

[dev-dependencies]
proptest = "1.12.0"
rcgen = "0.14"

[lints]
workspace = true
