[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flisbao/certtui"
rust-version = "1.97.0"
# Not published yet; also lets cargo-deny exempt internal path deps (bans.wildcards).
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
too_many_arguments = "deny"
cognitive_complexity = "warn"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
panic = "unwind"
