name: fuzz

on:
  pull_request:
  schedule:
    # Nightly, 03:17 UTC.
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            parse_der_cert,
            extract_text_certs,
            parse_pkcs7,
            parse_target,
            parse_pkcs12,
            parse_jks,
            parse_config_json,
          ]
    env:
      # 60 s on pull requests, 30 min on the nightly schedule.
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '60' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-fuzz

      # AddressSanitizer keeps freed memory in a 256 MiB quarantine by default,
      # which alone trips the 256 MiB RSS limit on fast targets (the JKS target
      # does ~60k execs/s). The real heap stays near 90 MiB.
      - name: Run fuzz target
        working-directory: fuzz
        env:
          ASAN_OPTIONS: quarantine_size_mb=16
        run: >-
          cargo +nightly fuzz run "${{ matrix.target }}"
          -- -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=256 -timeout=2

      # The fuzz run already fails on a crash; this also guards against a
      # crash artifact left behind without a failing exit status.
      - name: Fail on crash artifacts
        if: always()
        run: |
          dir="fuzz/artifacts/${{ matrix.target }}"
          if [ -d "$dir" ] && [ -n "$(find "$dir" -type f -print -quit)" ]; then
            echo "crash artifacts found in $dir" >&2
            find "$dir" -type f >&2
            exit 1
          fi

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
